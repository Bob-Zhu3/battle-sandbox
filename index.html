<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d3e6a6" />
    <title>Battle Sandbox</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="game">
      <canvas id="landscape" class="field-layer" aria-hidden="true"></canvas>
      <canvas id="arena" class="field-layer" width="960" height="360" tabindex="-1" aria-label="Playground. Choose a color and draw troops anywhere." aria-describedby="deploy-hint">
        The pennants show how many units are alive on each team.
      </canvas>

      <header class="top-hud">
        <h1 class="wordmark" aria-label="Battle Sandbox"><span>Battle</span><span>Sandbox</span></h1>
        <div id="score" class="score" role="group" aria-label="Units on the field"></div>
        <div class="demo-controls">
          <details id="demo-picker">
            <summary class="demo-button"><span class="flag-icon" aria-hidden="true"></span>Play modes <span aria-hidden="true">▾</span></summary>
            <div class="demo-options">
              <a href="/" aria-current="page">Playground <small>Solo</small></a>
              <a href="/room">Duel <small>2 players</small></a>
              <a href="/ffa">Free-for-all <small>3–4 players</small></a>
            </div>
          </details>
          <a id="room-leave" class="demo-button" href="/" hidden>Leave match</a>
        </div>
        <div id="result" class="result" role="status" hidden>
          <strong id="result-title"></strong><span id="result-detail"></span>
        </div>
      </header>

      <div id="empty-guide" class="empty-guide">
        <h2>Draw your armies</h2>
        <p>Pick a color and draw anywhere. Add another color to start a fight.</p>
      </div>
      <div id="countdown" class="countdown" role="status" hidden><span>Battle begins in</span><strong id="countdown-number">3</strong></div>
      <footer class="bottom-hud">
        <div class="match-readout"><span id="scenario-name" hidden></span><strong id="match-state" role="status">Deployment</strong><span>Tick <b id="tick">000</b></span></div>
        <div class="tools">
          <p id="deploy-hint" class="hint" hidden></p>
          <div class="tool-strip" role="group" aria-label="Battle controls">
            <div id="team-tools" class="team-tools" role="group" aria-label="Army color"></div>
            <div id="wallet" class="wallet" aria-label="Available gold"><i class="coin" aria-hidden="true"></i><span><small>Gold</small><strong id="gold-balance">∞</strong><small id="gold-rate" hidden></small></span></div>
            <div id="brush-tool" class="brush-choices" role="group" aria-label="Unit brush"></div>
            <button id="undo" class="tool" type="button" aria-label="Undo stroke" title="Undo the last stroke" disabled><i aria-hidden="true">↶</i>Undo</button>
            <button id="clear" class="tool" type="button" disabled><i class="eraser" aria-hidden="true"></i>Clear</button>
            <button id="play" class="play" type="button" hidden disabled><i id="play-icon" class="play-icon" aria-hidden="true"></i><span id="play-label">Ready</span></button>
          </div>
        </div>
      </footer>
    </main>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
