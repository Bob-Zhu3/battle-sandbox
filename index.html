<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#d3e6a6" />
    <title>Battle Sandbox</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="game">
      <canvas id="landscape" class="field-layer" aria-hidden="true"></canvas>
      <canvas id="arena" class="field-layer" width="960" height="360" tabindex="-1" aria-label="Battlefield. Draw red units on the left and blue units on the right." aria-describedby="deploy-hint">
        The pennants show how many units are alive on each team.
      </canvas>

      <header class="top-hud">
        <h1 class="wordmark" aria-label="Battle Sandbox"><span>Battle</span><span>Sandbox</span></h1>
        <div class="score" role="group" aria-label="Units on the field">
          <div id="red-score" class="pennant red">
            <span class="pennant-name">Red</span><strong id="red-count">0</strong>
            <span class="life-line" aria-hidden="true"><i id="red-bar"></i></span>
            <span id="red-seat" class="seat-label" hidden></span>
            <span class="sr-only"><span id="red-hp">0</span> of <span id="red-max">0</span> HP</span>
          </div>
          <span class="versus" aria-hidden="true">vs</span>
          <div id="blue-score" class="pennant blue">
            <span class="pennant-name">Blue</span><strong id="blue-count">0</strong>
            <span class="life-line" aria-hidden="true"><i id="blue-bar"></i></span>
            <span id="blue-seat" class="seat-label" hidden></span>
            <span class="sr-only"><span id="blue-hp">0</span> of <span id="blue-max">0</span> HP</span>
          </div>
        </div>
        <div class="demo-controls">
          <details id="demo-picker">
            <summary class="demo-button"><span class="flag-icon" aria-hidden="true"></span>Play modes <span aria-hidden="true">▾</span></summary>
            <div class="demo-options">
              <a href="/room" target="_blank" rel="noopener">Two-player room ↗</a>
              <button id="demo-archers" type="button">Archer screen</button>
              <button id="demo-warriors" type="button">20 vs 20 Warriors</button>
            </div>
          </details>
          <button id="demo-back" class="demo-button" type="button" hidden><span class="flag-icon" aria-hidden="true"></span>Back to field</button>
          <a id="room-leave" class="demo-button" href="/" hidden>Leave room</a>
        </div>
        <div id="result" class="result" role="status" hidden>
          <strong id="result-title"></strong><span id="result-detail"></span>
        </div>
      </header>

      <div id="empty-guide" class="empty-guide">
        <h2>Draw your armies</h2>
        <p>Click or drag. Red on the left, blue on the right.</p>
      </div>
      <footer class="bottom-hud">
        <div class="match-readout"><span id="scenario-name" hidden></span><strong id="match-state" role="status">Deployment</strong><span>Tick <b id="tick">000</b></span></div>
        <div class="tools">
          <p id="deploy-hint" class="hint" hidden></p>
          <div class="tool-strip" role="group" aria-label="Battle controls">
            <div id="brush-tool" class="brush-choices" role="group" aria-label="Unit brush">
              <button id="brush-warrior" class="brush-tool" type="button" aria-pressed="true"><canvas id="icon-warrior" class="brush-icon" width="72" height="72" aria-hidden="true"></canvas>Warrior</button>
              <button id="brush-archer" class="brush-tool" type="button" aria-pressed="false"><canvas id="icon-archer" class="brush-icon" width="72" height="72" aria-hidden="true"></canvas>Archer</button>
            </div>
            <button id="undo" class="tool" type="button" aria-label="Undo stroke" title="Undo the last stroke" disabled><i aria-hidden="true">↶</i>Undo</button>
            <button id="clear" class="tool" type="button" disabled><i class="eraser" aria-hidden="true"></i>Clear</button>
            <button id="edit" class="tool" type="button" hidden>Edit formation</button>
            <button id="replay" class="tool" type="button" hidden><i aria-hidden="true">↻</i>Replay</button>
            <button id="play" class="play" type="button" disabled><i id="play-icon" class="play-icon" aria-hidden="true"></i><span id="play-label">Start</span></button>
          </div>
        </div>
        <span class="key-hint"><kbd>Space</kbd><span id="key-action">Start</span></span>
      </footer>
    </main>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
