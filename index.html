<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f8f5" />
    <title>Battlefield · Battle Sandbox</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>Battle Sandbox</div>
        <span class="rate"><span class="clock-icon" aria-hidden="true"></span><span id="tick-rate">60</span> ticks / sec</span>
      </header>

      <div class="match-heading">
        <h1>Battlefield</h1>
        <div class="tick-counter">Tick <span id="tick">000</span></div>
      </div>

      <section class="arena-panel" aria-label="Battle arena">
        <div class="scoreboard">
          <div class="fighter red">
            <div class="fighter-heading"><span class="fighter-label">Red team</span><span id="red-count" class="unit-count">0 Warriors</span></div>
            <div class="health-row">
              <span class="health-track" aria-hidden="true"><span id="red-bar"></span></span>
              <span class="health-number"><b id="red-hp">0</b> / <span id="red-max">0</span> HP</span>
            </div>
          </div>
          <span class="match-state" id="match-state" role="status">Deployment</span>
          <div class="fighter blue">
            <div class="fighter-heading"><span class="fighter-label">Blue team</span><span id="blue-count" class="unit-count">0 Warriors</span></div>
            <div class="health-row">
              <span class="health-track" aria-hidden="true"><span id="blue-bar"></span></span>
              <span class="health-number"><b id="blue-hp">0</b> / <span id="blue-max">0</span> HP</span>
            </div>
          </div>
        </div>

        <div class="field">
          <canvas id="arena" width="960" height="360" aria-label="Battlefield. Deploy red Warriors on the left half and blue Warriors on the right half." aria-describedby="deploy-hint">
            The scoreboard shows the number of Warriors and health for each team.
          </canvas>
          <div id="result" class="result" role="status" hidden>
            <strong id="result-title"></strong>
            <span id="result-detail"></span>
          </div>
        </div>

        <div class="control-bar">
          <div class="buttons">
            <button id="play" type="button" class="primary" disabled><span id="play-icon" class="play-icon" aria-hidden="true"></span><span id="play-label">Start</span></button>
            <button id="replay" type="button" class="secondary" hidden>Replay</button>
            <button id="edit" type="button" class="secondary" hidden>Edit formation</button>
            <button id="undo" type="button" class="secondary" disabled>Undo stroke</button>
            <button id="clear" type="button" class="secondary" disabled>Clear</button>
          </div>
          <p id="deploy-hint" class="deploy-hint">Click or drag on each half to deploy.</p>
          <div id="rules" class="rules" hidden><span>Hit <b id="damage">10</b> HP</span><span>Cooldown <b id="cooldown">30</b> ticks</span></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
